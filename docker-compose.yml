services:
  postgres:
    volumes:
      - pgdata:/var/lib/postgresql
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: snip_dev  # throwaway password
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  
  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:snip_dev@postgres:5432/url_shortener?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: snip-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:snip_dev@postgres:5432/url_shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      ADDR: 0.0.0.0:8080
      BASE_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    

volumes:
  pgdata:

